<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}HemoVision Alert{% endblock %}</title>
</head>
<body>
  <main>
    {% if messages %}
      <div role="status">
        {% for mensaje in messages %}
          <p>{{ mensaje }}</p>
        {% endfor %}
      </div>
    {% endif %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
